<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Navbar HUMG</title>
    <style>
        body {
            margin: 0;
             }
        .muc{
            margin: 0;
        }     

        .danh-sach-muc {
            padding: 0;
            margin: 0;
        }

        .lienket {
            color:#ffffff;
            /* bỏ gạch chân */
            text-decoration: none;
        }

        .danh-muc {
            background-color: #0277bd;
            gap: 20px;
            display: flex;
            /* gap khoảng cách các đối tượng ở trong */
            padding: 0;
            margin: 0;
            /* bỏ dấu chấm ở danh sách khi dùng ul,li */
            list-style: none;
        }

        .trai {
            width: 20%;
            height: 100vh;
        }
        .khoi-dang-nhap {
            width: 100%;
            height: 100px;
        }
        form {
            background-color:bisque;
            margin: 10px auto;
            width: 80%;
        }
        .khoi {
            width: 100%;
        }
        input{
            width: 100%;
            padding: 5px 0;
        }
        .quen-mat-khau{
            display: flex;
            justify-content: flex-end;
        }
        .quen-mat-khau-lien-ket{
            color:#0277bd;
            text-decoration: none;
        }
        button{
            width: 100%;
            padding: 5px 0;
        }

        .phai {
            width: 80%;
            background-color:#0288d1;
            height: 100vh;
        }
        .main {
            display: flex;
        }
    </style>
</head>
<body>
    <!-- Danh mục-->
    <nav class="danh-sach-muc">
        <ul class="danh-muc">
            <li class="muc"><a href="#" class="lienket">Thực tập, Đồ án</a></li>
            <li class="muc"><a href="#" class="lienket">Thủ tục Một Cửa</a></li>
            <li class="muc"><a href="#" class="lienket">Một Cửa online</a></li>
            <li class="muc"><a href="#" class="lienket">E-mail HUMG</a></li>
        </ul>
    </nav>
    <main>
        <div class="trai">
            <div class="khoi-dang-nhap"></div>
            <form action="">
                <div class="khoi">
                    <p>Tài khoản</p>
                    <input tpye="text" name="" id="">
                </div>
                <div class="khoi-thong-tin">
                    <p>Mật khẩu</p>
                    <input tpye="password" name="" id="">
                </div>
                <div class="quen-mat-khau">
                    <a class="quen-mat-khau-lien-ket" href="">Quên mật khẩu</a>
                    <input tpye="text" name="" id="">
                </div>
                <div class="khoi-thong-tin">
                    <button>Đăng nhập</button>
                    <button>Đăng nhập với Microsoft office</button>
                </div>

            </form>
         
        </div>
